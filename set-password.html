<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gulv Master — sæt din adgangskode</title>
  <style>
    :root{--navy:#0f2240;--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--bg:#f4f7fb;--good:#047857;--bad:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:28px}
    .card{width:min(440px,100%);background:white;border:1px solid var(--line);box-shadow:0 18px 55px rgba(15,34,64,.12);border-radius:18px;overflow:hidden}
    .top{background:var(--navy);padding:25px 28px;color:white}.top h1{margin:0;font-size:21px;letter-spacing:-.5px}.top p{margin:7px 0 0;color:#c9d6ec;font-size:13.5px;line-height:1.5}
    .body{padding:28px}
    label{display:block;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin:0 0 7px}
    label.second{margin-top:17px}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;color:var(--ink)}
    input:focus{outline:3px solid #dbeafe;border-color:#60a5fa}
    button{margin-top:19px;width:100%;border:0;border-radius:9px;background:var(--blue);color:white;font:800 14px inherit;padding:13px;cursor:pointer}
    button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:not-allowed}
    .status{display:none;margin-top:17px;border-radius:10px;padding:13px 14px;font-size:13px;line-height:1.5}
    .status.show{display:block}.status.bad{background:#fef2f2;color:var(--bad);border:1px solid #fecaca}.status.good{background:#ecfdf5;color:var(--good);border:1px solid #a7f3d0}
    .footer{margin-top:20px;padding-top:17px;border-top:1px solid var(--line);font-size:12px;line-height:1.55;color:var(--muted)}
    .footer a{color:var(--blue);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <section class="top"><h1>Sæt din adgangskode</h1><p>Vælg en adgangskode til Gulv Masters planlægningssystem. Mindst 6 tegn.</p></section>
    <section class="body">
      <form id="form">
        <label for="password">Ny adgangskode</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Mindst 6 tegn">
        <label class="second" for="password2">Gentag adgangskode</label>
        <input id="password2" type="password" autocomplete="new-password" required minlength="6" placeholder="Samme adgangskode igen">
        <button id="submit" type="submit">Gem adgangskode</button>
      </form>
      <div id="status" class="status"></div>
      <div class="footer" id="footer">Har du problemer med linket? Kontakt din administrator for et nyt.</div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const form = document.getElementById('form'), status = document.getElementById('status'), button = document.getElementById('submit');
    function show(kind, message) { status.className = 'status show ' + kind; status.textContent = message; }
    if (!token) { show('bad', 'Linket mangler en token — brug linket fra din e-mail.'); form.style.display = 'none'; }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value, p2 = document.getElementById('password2').value;
      if (p1 !== p2) return show('bad', 'Adgangskoderne er ikke ens.');
      if (p1.length < 6) return show('bad', 'Adgangskoden skal være mindst 6 tegn.');
      button.disabled = true;
      try {
        const response = await fetch('/api/set-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: p1 })
        });
        const data = await response.json().catch(() => ({ error: 'Serveren returnerede ikke et gyldigt svar.' }));
        if (!response.ok) throw new Error(data.error || 'Kunne ikke sætte adgangskoden.');
        show('good', 'Din adgangskode er sat. Du kan nu logge ind.');
        form.style.display = 'none';
        document.getElementById('footer').innerHTML = 'Gå til <a href="/employee">login</a> for at logge ind.';
      } catch (error) {
        show('bad', String(error.message || error));
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
