<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gulv Master — Min kalender</title>
<style>
:root{--navy:#0f2240;--navy2:#1c3557;--blue:#2563eb;--ice:#f4f7fc;--white:#fff;--ink:#0f1923;--muted:#5a6a7e;--ghost:#94a3b8;--border:#e2e8f0;--green:#059669;--amber:#d97706;--radius:13px;--shadow:0 2px 10px rgba(15,34,64,.08);--shadow-lg:0 16px 42px rgba(15,34,64,.22)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--ice);color:var(--ink)}
.topbar{height:58px;background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.2)}.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750}.logo{width:31px;height:31px;border-radius:8px;background:#2e5086;display:grid;place-items:center}.user{display:flex;align-items:center;gap:8px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800}.logout{border:1px solid rgba(255,255,255,.28);border-radius:7px;padding:5px 9px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;cursor:pointer}
.main{max-width:800px;margin:0 auto;padding:16px}.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 13px}.week-title{font-weight:800;font-size:18px;color:var(--navy)}.week-sub{font-size:11px;color:var(--muted);margin-top:2px}.week-buttons{display:flex;gap:5px;align-items:center}.small-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 9px;font-weight:650;font-size:11px;cursor:pointer;color:var(--muted)}.small-btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.week-overview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:15px}.day-chip{background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 3px;text-align:center;cursor:pointer}.day-chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.day-chip.has{border-bottom:3px solid var(--blue)}.day-chip .d1{font-size:9px;font-weight:800;opacity:.72}.day-chip .d2{font-size:15px;font-weight:800}.day-chip .d3{font-size:9px;min-height:12px;margin-top:2px}
.view-notice{background:#eaf1ff;border:1px solid #c7d7ff;color:#174ea6;border-radius:9px;padding:8px 10px;margin:0 0 14px;font-size:11px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}.view-notice button{border:none;background:transparent;color:#174ea6;font-weight:800;font-size:11px;cursor:pointer;text-decoration:underline}
.day-section{margin:0 0 16px;scroll-margin-top:72px}.day-head{display:flex;align-items:center;gap:7px;margin:0 0 7px}.day-name{font-size:14px;font-weight:800;color:var(--navy)}.day-date{font-size:12px;color:var(--muted)}.today{background:var(--blue);color:#fff;font-size:9px;border-radius:9px;padding:2px 7px;font-weight:800}.empty-day{background:#fff;border:1px solid var(--border);color:var(--ghost);border-radius:10px;text-align:center;padding:14px;font-size:12px}
.task{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin:0 0 9px}.task-head{display:flex;justify-content:space-between;gap:10px}.task-title{font-weight:800;font-size:15px;color:var(--navy);line-height:1.25}.task-sub{font-size:11px;color:var(--muted);margin-top:3px}.badge{font-size:8px;font-weight:800;border-radius:8px;padding:3px 6px;white-space:nowrap;line-height:1.15;height:max-content;max-width:105px;text-align:center}.job-details{margin:11px 0 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:9px 0;display:grid;gap:6px}.detail-line{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--muted);line-height:1.35}.detail-line a{color:#1d4ed8;text-decoration:none;font-weight:650}.detail-line a:hover{text-decoration:underline}.detail-line.planned{color:#475569}.weather-line{font-size:11px;color:var(--muted)}.weather-line.loading{color:var(--ghost)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:0;border-radius:9px;padding:10px 8px;font-size:11px;font-weight:800;min-height:42px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-decoration:none;text-align:center}.action.maps{background:#f59e0b;color:#fff}.action.note{background:#eaf1ff;color:#174ea6}.action.info{background:var(--navy);color:#fff}.action.time{background:var(--green);color:#fff}.action:hover{filter:brightness(.97);transform:translateY(-1px)}
.empty{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:38px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:40px}.empty h3{color:var(--navy);margin:7px 0 4px;font-size:16px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,80px);background:var(--navy);color:#fff;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:12px;opacity:0;transition:.22s;z-index:300}.toast.show{transform:translate(-50%,0);opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,34,64,.52);display:none;align-items:center;justify-content:center;padding:18px;z-index:250}.modal-backdrop.open{display:flex}.modal{width:min(450px,100%);background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}.modal-head{background:var(--navy);color:#fff;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-title{font-size:14px;font-weight:800}.modal-close{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}.modal-body{padding:16px}.modal-task{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:9px}.modal-note{font-size:13px;line-height:1.55;color:#334155;white-space:pre-wrap;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:12px}.modal-empty{color:var(--ghost);font-style:italic}
@media(max-width:560px){.main{padding:12px}.user-name{display:none}.week-buttons{gap:4px}.week-buttons .small-btn{padding:7px}.task{padding:12px}.topbar{padding:0 12px}.actions{grid-template-columns:1fr 1fr}.action{font-size:10px;padding:9px 6px}.week-nav{align-items:flex-start}.week-buttons{flex-wrap:wrap;justify-content:flex-end}.week-title{font-size:17px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="logo">🪵</span><span>Gulv Master</span></div><div class="user"><span id="user-name" class="user-name"></span><span id="user-avatar" class="avatar">?</span><button class="logout" onclick="logout()">Log ud</button></div></header>
<main class="main">
  <div class="week-nav"><div><div id="week-label" class="week-title">Indlæser...</div><div id="week-sub" class="week-sub"></div></div><div class="week-buttons"><button id="whole-week-btn" class="small-btn primary" onclick="showWholeWeek()">Hele uge</button><button class="small-btn" onclick="changeWeek(-1)">←</button><button class="small-btn primary" onclick="goToday()">I dag</button><button class="small-btn" onclick="changeWeek(1)">→</button></div></div>
  <div id="week-overview" class="week-overview"></div>
  <div id="selected-notice"></div>
  <div id="tasks-container"><div class="empty"><div class="empty-icon">⏳</div><h3>Henter dine opgaver...</h3></div></div>
</main>
<div id="note-modal" class="modal-backdrop" onclick="closeNoteOnBackdrop(event)"><div class="modal"><div class="modal-head"><div class="modal-title">📝 Note til opgaven</div><button class="modal-close" onclick="closeNote()">Luk</button></div><div class="modal-body"><div id="note-task" class="modal-task"></div><div id="note-text" class="modal-note"></div></div></div></div>
<div id="toast" class="toast"></div>
<script>
const token=localStorage.getItem('gm_token');
const user=JSON.parse(localStorage.getItem('gm_user')||'null');
let assignments=[],weekOffset=0,selectedDate=null;
const bookingNotes=new Map();
const weatherItems=new Map();
const JOBTREAD_TIME_URL='https://app.jobtread.com/time';
if(!token||!user)location.href='/';
document.getElementById('user-name').textContent=(user.name||'').split(' ')[0]||'Medarbejder';
document.getElementById('user-avatar').textContent=user.initials||(user.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2);
document.getElementById('user-avatar').style.background=(user.color||'#2563eb')+'22';
document.getElementById('user-avatar').style.color=user.color||'#2563eb';
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
function logout(){localStorage.removeItem('gm_token');localStorage.removeItem('gm_user');location.href='/'}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{Authorization:'Bearer '+token,...(opts.headers||{})}});if(r.status===401){logout();return null}let d;try{d=await r.json()}catch(e){d={error:'Serveren returnerede et ugyldigt svar'}}return {ok:r.ok,status:r.status,data:d}}
function monday(d){let x=new Date(d);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}
function iso(d){return d.toISOString().slice(0,10)}
function getWeekDays(off){let m=monday(new Date());m.setDate(m.getDate()+off*7);return Array.from({length:5},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}
function sameDay(d){let n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function weekNumber(d){let x=new Date(d);let day=x.getDay()||7;x.setDate(x.getDate()+4-day);let y=new Date(Date.UTC(x.getFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
const TYPES={lay:['Gulvlægning','#dbeafe','#1d4ed8'],sand:['Gulvslibning','#dcfce7','#15803d'],paint:['Malerservice','#fef9c3','#92570a'],sub:['Underleverandør','#ede9fe','#5b21b6'],other:['Andet','#f1f5f9','#475569']};
function tasksFor(date){return assignments.filter(a=>date>=String(a.start_date).slice(0,10)&&date<=String(a.end_date||a.start_date).slice(0,10))}
function phoneValue(a){return String(a.customer_phone||a.job_phone||a.customer_phone_number||'').trim()}
function phoneHref(phone){return 'tel:'+phone.replace(/[^+\d]/g,'')}
function taskLink(a){return a.jt_url||'https://app.jobtread.com'}
function weatherKey(address,date){return 'gm-weather:'+date+':'+String(address||'').toLowerCase().trim()}
function weatherText(code,max,min,rain){const m={0:['☀️','Klart'],1:['🌤️','Mest klart'],2:['⛅','Let skyet'],3:['☁️','Overskyet'],45:['🌫️','Tåge'],48:['🌫️','Rimtåge'],51:['🌦️','Let støvregn'],53:['🌦️','Støvregn'],55:['🌧️','Kraftig støvregn'],61:['🌦️','Let regn'],63:['🌧️','Regn'],65:['🌧️','Kraftig regn'],71:['🌨️','Let sne'],73:['🌨️','Sne'],75:['❄️','Kraftig sne'],80:['🌦️','Byger'],81:['🌧️','Regnbyger'],82:['⛈️','Kraftige byger'],95:['⛈️','Tordenvejr'],96:['⛈️','Torden og hagl'],99:['⛈️','Kraftigt tordenvejr']}[Number(code)]||['🌤️','Vejr'];const temps=(Number.isFinite(Number(min))&&Number.isFinite(Number(max)))?`${Math.round(min)}–${Math.round(max)}°`:'Temperatur ukendt';const rainText=Number.isFinite(Number(rain))?` · ${Math.round(rain)}% regn`:'';return `${m[0]} ${m[1]} · ${temps}${rainText}`}
async function getWeather(address,date){
  if(!address) return '🌦️ Vejr kræver en adresse';
  const key=weatherKey(address,date);const cached=localStorage.getItem(key);
  try{if(cached){const c=JSON.parse(cached);if(c&&c.savedAt&&Date.now()-c.savedAt<30*60*1000&&c.text)return c.text}}catch(e){}
  try{
    const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(address)+'&count=1&language=da&format=json');
    const geoData=await geo.json(); const place=geoData&&geoData.results&&geoData.results[0];
    if(!place) return '🌦️ Vejr ikke fundet for adressen';
    const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(place.latitude)+'&longitude='+encodeURIComponent(place.longitude)+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FCopenhagen&start_date='+encodeURIComponent(date)+'&end_date='+encodeURIComponent(date);
    const res=await fetch(url); const data=await res.json(); const d=data&&data.daily;
    if(!d||!d.time||!d.time.length) return '🌦️ Vejrprognose er ikke tilgængelig';
    const text=weatherText(d.weather_code&&d.weather_code[0],d.temperature_2m_max&&d.temperature_2m_max[0],d.temperature_2m_min&&d.temperature_2m_min[0],d.precipitation_probability_max&&d.precipitation_probability_max[0]);
    try{localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),text:text}))}catch(e){}
    return text;
  }catch(e){return '🌦️ Vejr kunne ikke hentes'}
}
async function hydrateWeather(){
  const nodes=[...document.querySelectorAll('[data-weather-id]')];
  const unique=new Map();
  nodes.forEach(n=>{const id=n.dataset.weatherId;const item=weatherItems.get(id);if(item)unique.set(id,item)});
  await Promise.all([...unique.entries()].map(async([id,item])=>{const text=await getWeather(item.address,item.date);document.querySelectorAll('[data-weather-id="'+CSS.escape(id)+'"]').forEach(el=>{el.textContent=text;el.classList.remove('loading')})}));
}
function openBookingNote(id){const x=bookingNotes.get(String(id))||{};document.getElementById('note-task').textContent=x.title||'Opgave';const note=String(x.note||'').trim();const nt=document.getElementById('note-text');nt.textContent=note||'Der er ikke tilføjet en note til denne booking endnu.';nt.classList.toggle('modal-empty',!note);document.getElementById('note-modal').classList.add('open')}
function closeNote(){document.getElementById('note-modal').classList.remove('open')}
function closeNoteOnBackdrop(e){if(e.target===document.getElementById('note-modal'))closeNote()}
function showWholeWeek(){selectedDate=null;render()}
function selectDay(date){selectedDate=date;render()}
function dayName(d){return d.toLocaleDateString('da-DK',{weekday:'long'}).replace(/^./,x=>x.toUpperCase())}
function render(){
  const days=getWeekDays(weekOffset); if(selectedDate&&!days.some(d=>iso(d)===selectedDate))selectedDate=null;
  document.getElementById('week-label').textContent='Uge '+weekNumber(days[0]);
  document.getElementById('week-sub').textContent=days[0].toLocaleDateString('da-DK',{day:'numeric',month:'short'})+' – '+days[4].toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('whole-week-btn').classList.toggle('primary',!selectedDate);
  document.getElementById('week-overview').innerHTML=days.map((d,i)=>{const date=iso(d),list=tasksFor(date),active=selectedDate===date;return `<button class="day-chip ${active?'active':''} ${list.length?'has':''}" onclick="selectDay('${date}')"><div class="d1">${['Man','Tir','Ons','Tor','Fre'][i]}</div><div class="d2">${d.getDate()}</div><div class="d3">${list.length?list.length+' opg.':''}</div></button>`}).join('');
  const selected=selectedDate?days.filter(d=>iso(d)===selectedDate):days;
  document.getElementById('selected-notice').innerHTML=selectedDate?`<div class="view-notice"><span>Viser kun <strong>${dayName(selected[0])} ${selected[0].toLocaleDateString('da-DK',{day:'numeric',month:'long'})}</strong>.</span><button onclick="showWholeWeek()">Vis hele uge</button></div>`:'';
  bookingNotes.clear();weatherItems.clear();
  let out='',total=0;
  selected.forEach(d=>{const date=iso(d),list=tasksFor(date);total+=list.length;out+=`<section class="day-section" id="day-${date}"><div class="day-head"><span class="day-name">${dayName(d)}</span><span class="day-date">${d.toLocaleDateString('da-DK',{day:'numeric',month:'long'})}</span>${sameDay(d)?'<span class="today">I dag</span>':''}</div>`;
    if(!list.length){out+='<div class="empty-day">Ingen planlagte opgaver</div>';}else{list.forEach(a=>{
      const t=TYPES[a.type_guess]||TYPES.other;const address=String(a.job_address||'').trim();const phone=phoneValue(a);const maps=address?'https://maps.google.com/?q='+encodeURIComponent(address):'';const weatherId='w-'+String(a.id)+'-'+date.replace(/[^0-9]/g,'');weatherItems.set(weatherId,{address:address,date:date});bookingNotes.set(String(a.id),{note:a.notes,title:(a.job_name||'Opgave')+' — '+(a.task_name||'')});
      const mapButton=maps?`<a class="action maps" href="${maps}" target="_blank" rel="noopener">📍 Maps</a>`:`<button class="action maps" type="button" onclick="toast('Adresse mangler på opgaven')">📍 Maps</button>`;
      const phoneMarkup=phone?`<a href="${esc(phoneHref(phone))}">${esc(phone)}</a>`:'<span>Kundetelefon ikke tilføjet</span>';
      const noteId=Number(a.id)||0;
      out+=`<article class="task"><div class="task-head"><div><div class="task-title">${esc(a.job_name||'Opgave')}</div><div class="task-sub">${esc(a.task_name||'')}</div></div><span class="badge" style="background:${t[1]};color:${t[2]}">${t[0]}</span></div><div class="job-details"><div class="detail-line">📍 <span>${address?esc(address):'Adresse mangler'}</span></div><div class="detail-line">📞 ${phoneMarkup}</div><div class="detail-line weather-line loading" data-weather-id="${weatherId}">🌦️ Vejr hentes…</div><div class="detail-line planned">⏱ Planlagt: ${esc(a.days)} dag${Number(a.days)!==1?'e':''}${a.start_time?' · '+esc(a.start_time):''}</div></div><div class="actions">${mapButton}<button class="action note" type="button" onclick="openBookingNote(${noteId})">📝 Note til opgaven</button><a class="action info" href="${esc(taskLink(a))}" target="_blank" rel="noopener">📋 Læs om opgaven</a><a class="action time" href="${JOBTREAD_TIME_URL}" target="_blank" rel="noopener">⏱ Track dine timer</a></div></article>`;
    });}
    out+='</section>';});
  document.getElementById('tasks-container').innerHTML=total?out:'<div class="empty"><div class="empty-icon">📅</div><h3>Ingen opgaver i denne visning</h3><p>Vælg en anden dag eller vis hele ugen.</p></div>';
  hydrateWeather();
}
function changeWeek(n){weekOffset+=n;selectedDate=null;render()}
function goToday(){weekOffset=0;const d=new Date();selectedDate=d.getDay()>=1&&d.getDay()<=5?iso(d):null;render()}
async function loadAll(){const a=await api('/api/assignments/my');assignments=a&&a.ok?a.data:[];render()}
loadAll();
</script>
</body>
</html>
