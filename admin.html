<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulv Master — Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2240;--navy2:#1C3557;--steel:#2E5086;
  --white:#fff;--ice:#F4F7FC;--ink:#0F1923;--muted:#5A6A7E;--ghost:#94A3B8;
  --border:#CBD5E1;--border2:#E2E8F0;
  --lay-bg:#DBEAFE;--lay-fg:#1D4ED8;
  --sand-bg:#DCFCE7;--sand-fg:#15803D;
  --paint-bg:#FEF9C3;--paint-fg:#92570A;
  --sub-bg:#EDE9FE;--sub-fg:#5B21B6;
  --other-bg:#F1F5F9;--other-fg:#475569;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--ice);color:var(--ink);min-height:100vh}

/* NAV */
.nav{background:var(--navy);color:#fff;padding:0 18px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.nav-brand{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;background:var(--steel);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.nav-tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:3px}
.tab{padding:4px 11px;border-radius:4px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:11px;cursor:pointer;font-weight:500}
.tab.active{background:rgba(255,255,255,.15);color:#fff}
.nav-acts{display:flex;gap:5px;align-items:center}
.nb{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:11px;cursor:pointer;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.18)}
.nb.green{background:#059669;border-color:#059669}
.nb.blue{background:#2563EB;border-color:#2563EB}

/* MAIN */
.main{padding:12px 16px}
.page{display:none}.page.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:12px}
.sc{background:var(--white);border-radius:8px;border:1px solid var(--border2);padding:10px 12px;box-shadow:var(--shadow)}
.sl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.sv{font-size:19px;font-weight:700;color:var(--navy)}
.ss{font-size:9px;color:var(--ghost);margin-top:1px}
.sc.ok .sv{color:#16A34A}.sc.warn .sv{color:#B45309}

/* SYNC LOG */
.slog{background:#0A1628;border-radius:7px;padding:9px;margin-bottom:9px;font-family:monospace;font-size:9px;color:#6EE7B7;max-height:70px;overflow-y:auto;display:none;line-height:1.7}
.slog.show{display:block}
.sl-ok{color:#86EFAC}.sl-err{color:#FCA5A5}.sl-info{color:#93C5FD}

/* BOARD LAYOUT */
.board-layout{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}

/* LEFT PANEL */
.panel{background:var(--white);border-radius:var(--radius);border:1px solid var(--border2);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--border2);background:var(--ice);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.panel-body{padding:8px;max-height:calc(100vh - 180px);overflow-y:auto}
.search-box{width:100%;padding:6px 9px;border-radius:6px;border:1px solid var(--border);font-size:11px;outline:none;margin-bottom:7px}
.search-box:focus{border-color:var(--steel)}

/* TASK CARDS (draggable from pool) */
.task-card{background:var(--white);border:1px solid var(--border2);border-radius:7px;padding:8px 9px;margin-bottom:5px;cursor:grab;transition:box-shadow .15s,opacity .15s;user-select:none}
.task-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);border-color:var(--steel)}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.3;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tc-name{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:2px}
.tc-job{font-size:10px;color:var(--muted)}
.tc-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.type-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}
.tc-date{font-size:9px;color:var(--ghost)}
.tc-assigned{font-size:9px;color:#16A34A;font-weight:600}
.type-lay{background:var(--lay-bg);color:var(--lay-fg)}
.type-sand{background:var(--sand-bg);color:var(--sand-fg)}
.type-paint{background:var(--paint-bg);color:var(--paint-fg)}
.type-sub{background:var(--sub-bg);color:var(--sub-fg)}
.type-other{background:var(--other-bg);color:var(--other-fg)}

/* WEEK BOARD */
.week-bar{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.wbtn{padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:var(--white);font-size:11px;cursor:pointer;color:var(--muted);font-weight:500}
.wbtn:hover{border-color:var(--steel);color:var(--navy)}
.wbtn.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.week-label{font-size:12px;font-weight:700;color:var(--navy)}

/* BOARD TABLE */
.board-outer{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border2);background:var(--white);box-shadow:var(--shadow)}
.btable{border-collapse:collapse;min-width:max-content;width:100%}
.btable th{padding:8px 9px;background:var(--navy);color:#fff;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:10}
.btable th.pth{min-width:140px;position:sticky;left:0;z-index:11;border-right:2px solid rgba(255,255,255,.15)}
.btable th.dth{min-width:130px;text-align:center;border-left:1px solid rgba(255,255,255,.1)}
.dth.today-col{background:var(--steel)!important}
.btable td{vertical-align:top;border-bottom:1px solid var(--border2)}
.btable tbody tr:hover td{background:#FAFBFF}
.btable tbody tr:hover td.pcell{background:var(--ice)!important}
.pcell{padding:8px 9px;background:var(--ice)!important;position:sticky;left:0;z-index:5;border-right:2px solid var(--border2);min-width:140px}
.pname{font-size:11px;font-weight:700;color:var(--navy)}
.prole{font-size:9px;color:var(--muted)}
.pav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}

/* DAY CELLS */
.dcell{padding:5px 6px;min-width:130px;border-left:1px solid var(--border2);vertical-align:top}
.dcell.today-col{background:#FAFBFF}
.drop-zone{min-height:32px;border-radius:6px;transition:all .15s;padding:2px}
.drop-zone.dg-over{background:#EFF6FF;border:2px dashed #2563EB;padding:0}

/* ASSIGNMENT PILLS */
.apill{display:flex;align-items:flex-start;gap:4px;padding:5px 7px;border-radius:6px;margin-bottom:3px;font-size:10px;cursor:grab;border:none;width:100%;text-align:left;user-select:none;transition:box-shadow .15s,opacity .15s;flex-direction:column}
.apill:active{cursor:grabbing}
.apill.dragging{opacity:.3}
.apill-top{display:flex;align-items:center;gap:4px;width:100%}
.apill-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.apill-actions{display:flex;gap:2px;flex-shrink:0}
.apill-btn{background:none;border:none;cursor:pointer;font-size:11px;opacity:.5;padding:0 2px;line-height:1}
.apill-btn:hover{opacity:1}
.apill-extra{font-size:9px;opacity:.75;margin-top:2px;width:100%}
.apill-time{font-size:9px;font-weight:600;opacity:.85}
.apill-note{font-size:9px;opacity:.7;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-lay{background:var(--lay-bg);color:var(--lay-fg)}
.pill-sand{background:var(--sand-bg);color:var(--sand-fg)}
.pill-paint{background:var(--paint-bg);color:var(--paint-fg)}
.pill-sub{background:var(--sub-bg);color:var(--sub-fg)}
.pill-other{background:var(--other-bg);color:var(--other-fg)}
.free-slot{display:flex;align-items:center;justify-content:center;min-height:28px}
.free-b{font-size:9px;color:#16A34A;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:4px;padding:2px 7px;font-weight:600}

/* USERS PAGE */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.ucard{background:var(--white);border-radius:var(--radius);border:1px solid var(--border2);padding:13px;box-shadow:var(--shadow)}
.uc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.uc-name{font-size:12px;font-weight:700;color:var(--navy)}
.uc-email{font-size:10px;color:var(--muted)}
.uc-role{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}
.ra{background:#FEF3C7;color:#92400E}.re{background:#DBEAFE;color:#1D4ED8}
.uc-login{font-size:10px;background:var(--ice);border-radius:5px;padding:6px 8px;margin-top:6px;font-family:monospace}
.uc-acts{display:flex;gap:5px;margin-top:8px}
.ub{padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:var(--ice);font-size:10px;cursor:pointer;color:var(--muted)}
.ub:hover{border-color:var(--steel);color:var(--navy)}
.ub.del{color:#EF4444;border-color:#FECACA}
.ub.del:hover{background:#FEF2F2}

/* TIME LOGS */
.tlog-wrap{background:var(--white);border-radius:var(--radius);border:1px solid var(--border2);overflow:hidden;box-shadow:var(--shadow)}
.tlog-table{width:100%;border-collapse:collapse}
.tlog-table th{background:var(--navy);color:#fff;padding:8px 10px;font-size:9px;font-weight:700;text-align:left}
.tlog-table td{padding:7px 10px;border-bottom:1px solid var(--border2);font-size:11px}
.tlog-table tr:last-child td{border-bottom:none}
.tlog-table tr:hover td{background:var(--ice)}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(15,34,64,.5);z-index:500;align-items:center;justify-content:center}
.mo.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:20px;width:380px;max-width:95vw;box-shadow:0 8px 30px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:14px}
.fg{margin-bottom:10px}
.fl{display:block;font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.fi,.fs{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:var(--ice);color:var(--ink);outline:none}
.fi:focus,.fs:focus{border-color:var(--steel);background:var(--white)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--ice);color:var(--ink);font-weight:500}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{background:#FEE2E2;color:#B91C1C;border-color:#FECACA}
.assign-info{background:var(--ice);border-radius:7px;padding:9px 11px;margin-bottom:11px;font-size:11px}
.assign-info strong{color:var(--navy)}

/* PAGE HEADER */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
.pt{font-size:16px;font-weight:700;color:var(--navy)}
.ps{font-size:11px;color:var(--muted);margin-top:1px}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;z-index:1000;background:var(--navy);color:#fff;padding:9px 15px;border-radius:8px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(70px);opacity:0;transition:all .22s;pointer-events:none;display:flex;align-items:center;gap:6px}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>
<div style="display:none" id="app">

<nav class="nav">
  <div class="nav-brand"><div class="logo">🪵</div><span>Gulv Master — Admin</span></div>
  <div class="nav-tabs">
    <button class="tab active" data-page="plan">Planlægning</button>
    <button class="tab" data-page="users">Medarbejdere</button>
    <button class="tab" data-page="timelogs">Timer & Log</button>
  </div>
  <div class="nav-acts">
    <span id="sync-ind" style="font-size:10px;color:rgba(255,255,255,.5);display:none"></span>
    <button class="nb green" id="sync-btn" onclick="syncNow()">⚡ Synk JT</button>
    <button class="nb" onclick="window.location.href='/employee'">👤 Min side</button>
    <button class="nb" onclick="logout()">Log ud</button>
  </div>
</nav>

<div class="main">

<!-- PLAN PAGE -->
<div id="page-plan" class="page active">
  <div class="slog" id="slog"></div>
  <div class="stats" id="stats"></div>
  <div class="board-layout">
    <!-- LEFT: Task pool -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">📥 Opgaver fra JT</span>
        <span id="pool-count" style="font-size:10px;color:var(--muted)"></span>
      </div>
      <div class="panel-body">
        <input class="search-box" id="task-search" placeholder="Søg opgave eller kunde..." oninput="renderPool()">
        <div id="pool-list"></div>
      </div>
    </div>

    <!-- RIGHT: Week board -->
    <div>
      <div class="week-bar">
        <button class="wbtn" onclick="shiftW(-1)">← Forrige</button>
        <span class="week-label" id="wlabel"></span>
        <button class="wbtn" onclick="shiftW(1)">Næste →</button>
        <button class="wbtn today" onclick="goToday()">📍 I dag</button>
        <span style="font-size:10px;color:var(--muted);margin-left:4px">💡 Træk opgave fra listen til en medarbejder · Klik på en pill for at redigere</span>
      </div>
      <div class="board-outer">
        <table class="btable"><thead id="bth"></thead><tbody id="btb"></tbody></table>
      </div>
    </div>
  </div>
</div>

<!-- USERS PAGE -->
<div id="page-users" class="page">
  <div class="ph">
    <div><div class="pt">Medarbejdere & Brugere</div><div class="ps">Administrér login-adgang</div></div>
    <button class="nb blue" onclick="openAddUser()">+ Ny bruger</button>
  </div>
  <div class="ugrid" id="ugrid"></div>
</div>

<!-- TIME LOGS PAGE -->
<div id="page-timelogs" class="page">
  <div class="ph"><div><div class="pt">Timer & Aktivitetslog</div></div></div>
  <div class="tlog-wrap"><table class="tlog-table">
    <thead><tr><th>Medarbejder</th><th>Opgave</th><th>Kunde</th><th>Start</th><th>Stop</th><th>Varighed</th></tr></thead>
    <tbody id="tlog-body"></tbody>
  </table></div>
</div>

</div><!-- /main -->
</div><!-- /app -->

<!-- ASSIGNMENT MODAL (edit/add with time + note) -->
<div class="mo" id="mo-assign">
  <div class="modal">
    <h3 id="mo-title">Tildel opgave</h3>
    <div class="assign-info" id="mo-task-info"></div>
    <div class="fg">
      <label class="fl">Medarbejder</label>
      <select class="fs" id="a-user"></select>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Dag</label><select class="fs" id="a-day"></select></div>
      <div class="fg"><label class="fl">Antal dage</label><input class="fi" id="a-days" type="number" min="0.5" max="10" step="0.5" value="1"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Mødetid (valgfrit)</label><input class="fi" id="a-time" type="time" placeholder="07:00"></div>
      <div class="fg"><label class="fl">Dag i ugen</label>
        <select class="fs" id="a-weekday">
          <option value="">Alle dage</option>
          <option value="man">Mandag</option>
          <option value="tir">Tirsdag</option>
          <option value="ons">Onsdag</option>
          <option value="tor">Torsdag</option>
          <option value="fre">Fredag</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Note til medarbejder</label><input class="fi" id="a-note" placeholder="fx Husk at ringe inden ankomst..."></div>
    <div class="mb">
      <button class="btn danger" id="a-del-btn" style="display:none" onclick="deleteAssign()">Fjern tildeling</button>
      <button class="btn" onclick="closeMo()">Annuller</button>
      <button class="btn primary" onclick="saveAssign()">Gem</button>
    </div>
  </div>
</div>

<!-- USER MODAL -->
<div class="mo" id="mo-user">
  <div class="modal">
    <h3 id="mo-user-title">Tilføj bruger</h3>
    <div class="fr">
      <div class="fg"><label class="fl">Fuldt navn</label><input class="fi" id="u-name"></div>
      <div class="fg"><label class="fl">Initialer</label><input class="fi" id="u-ini" maxlength="3"></div>
    </div>
    <div class="fg"><label class="fl">Email (login)</label><input class="fi" id="u-email" type="email"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Adgangskode</label><input class="fi" id="u-pw" type="password" placeholder="Min. 6 tegn"></div>
      <div class="fg"><label class="fl">Rolle</label>
        <select class="fs" id="u-role">
          <option value="employee">Medarbejder</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Farve</label><input class="fi" id="u-color" type="color" value="#2563EB"></div>
      <div class="fg"><label class="fl">JT navn (til auto-tildeling)</label><input class="fi" id="u-jtname" placeholder="fx Adrian Sobon"></div>
    </div>
    <div class="mb">
      <button class="btn danger" id="u-del-btn" style="display:none" onclick="deactivateUser()">Deaktiver</button>
      <button class="btn" onclick="document.getElementById('mo-user').classList.remove('open')">Annuller</button>
      <button class="btn primary" onclick="saveUser()">Gem</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='';
var token=localStorage.getItem('gm_token');
var me=JSON.parse(localStorage.getItem('gm_user')||'null');
if(!token||!me||me.role!=='admin'){window.location.href='/';}
document.getElementById('app').style.display='block';

var users=[],tasks=[],assignments=[];
var weekOffset=0;
var dragTask=null; // {type:'pool',taskId} or {type:'assign',assignId}
var editAssignId=null,editUserId=null,pendingDrop=null;

function logout(){localStorage.removeItem('gm_token');localStorage.removeItem('gm_user');window.location.href='/';}
function toast(msg,icon){var t=document.getElementById('toast');t.innerHTML='<span>'+(icon||'✓')+'</span>'+msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
async function api(path,opts){
  var r=await fetch(API+path,Object.assign({},opts,{headers:Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},(opts&&opts.headers)||{})}));
  if(r.status===401){logout();return null;}
  return r.json();
}
function closeMo(){document.getElementById('mo-assign').classList.remove('open');editAssignId=null;pendingDrop=null;}

// Week helpers
function getWeekDays(off){
  var today=new Date(),day=today.getDay()||7;
  var mon=new Date(today);mon.setDate(today.getDate()-day+1+(off*7));mon.setHours(0,0,0,0);
  return Array.from({length:7},function(_,i){var d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function getWN(d){var D=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dy=D.getUTCDay()||7;D.setUTCDate(D.getUTCDate()+4-dy);var y=new Date(Date.UTC(D.getUTCFullYear(),0,1));return Math.ceil((((D-y)/86400000)+1)/7);}
function iso(d){return d.toISOString().split('T')[0];}
function fmt(d){return d.getDate()+'/'+(d.getMonth()+1);}
function isToday(d){var t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();}
function wkey(dateStr){var d=new Date(dateStr);var dy=d.getDay()||7;d.setDate(d.getDate()-dy+1);d.setHours(0,0,0,0);var wn=getWN(d);return 'w'+d.getFullYear()+'-'+String(wn).padStart(2,'0');}
var DAYS=['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
var TCFG={lay:{l:'Gulvlægning',c:'lay'},sand:{l:'Gulvslibning',c:'sand'},paint:{l:'Malerservice',c:'paint'},sub:{l:'Underlev.',c:'sub'},other:{l:'Andet',c:'other'}};

// Load all
async function loadAll(){
  var results=await Promise.all([api('/api/users'),api('/api/tasks'),api('/api/assignments')]);
  users=results[0]||[];tasks=results[1]||[];assignments=results[2]||[];
  renderStats();renderPool();renderBoard();renderUsers();
}

// Stats
async function renderStats(){
  var d=await api('/api/dashboard');if(!d)return;
  document.getElementById('stats').innerHTML=
    '<div class="sc"><div class="sl">Tasks fra JT</div><div class="sv">'+d.totalTasks+'</div><div class="ss">Fremtidige</div></div>'+
    '<div class="sc ok"><div class="sl">Tildelt</div><div class="sv">'+d.assigned+'</div><div class="ss">Bookede</div></div>'+
    '<div class="sc warn"><div class="sl">Utildelt</div><div class="sv">'+d.unassigned+'</div><div class="ss">Klar til tildeling</div></div>'+
    '<div class="sc"><div class="sl">Medarbejdere</div><div class="sv">'+d.employees+'</div><div class="ss">Aktive</div></div>'+
    '<div class="sc"><div class="sl">Sidst synket</div><div class="sv" style="font-size:12px">'+(d.lastSync&&d.lastSync.synced_at?d.lastSync.synced_at.replace('T',' ').substring(0,16):'Aldrig')+'</div></div>';
}

// Sync
async function syncNow(){
  var btn=document.getElementById('sync-btn');
  btn.textContent='⏳...';btn.style.background='#6B7280';btn.disabled=true;
  document.getElementById('slog').innerHTML='';document.getElementById('slog').classList.add('show');
  function sl(msg,cls){var d=document.createElement('div');d.className=cls||'sl-info';d.textContent='['+new Date().toLocaleTimeString('da-DK')+'] '+msg;document.getElementById('slog').appendChild(d);document.getElementById('slog').scrollTop=9999;}
  sl('Synkroniserer med JobTread...');
  var r=await api('/api/sync',{method:'POST'});
  if(r&&r.ok){sl(r.count+' tasks importeret ✓','sl-ok');toast('Synk OK — '+r.count+' tasks','✅');}
  else{sl('Fejl: '+(r&&r.error||'Ukendt'),'sl-err');toast('Synk fejlede','❌');}
  var ind=document.getElementById('sync-ind');ind.style.display='block';ind.textContent='Synket: '+new Date().toLocaleTimeString('da-DK');
  btn.textContent='⚡ Synk JT';btn.style.background='';btn.disabled=false;
  await loadAll();
}

// Pool
function renderPool(){
  var search=(document.getElementById('task-search')&&document.getElementById('task-search').value||'').toLowerCase();
  var filtered=tasks.filter(function(t){
    return !search||((t.job_name||'').toLowerCase().includes(search))||(t.name||'').toLowerCase().includes(search);
  });
  filtered.sort(function(a,b){return (a.start_date||'').localeCompare(b.start_date||'');});
  document.getElementById('pool-count').textContent=filtered.length+' opgaver';
  var assignedIds=new Set(assignments.map(function(a){return a.task_id;}));
  document.getElementById('pool-list').innerHTML=filtered.map(function(t){
    var tc=TCFG[t.type_guess]||TCFG.other;
    var isA=assignedIds.has(t.id);
    return '<div class="task-card" draggable="true" data-task-id="'+t.id+'"'+
      ' ondragstart="onPoolDS(event,\''+t.id+'\')"'+
      ' ondragend="onPoolDE()"'+
      ' onclick="openAssignFromPool(\''+t.id+'\')"'+
      ' style="'+(isA?'border-left:3px solid #16A34A;':'')+'">' +
      '<div class="tc-name">'+escHtml(t.job_name||'Opgave')+'</div>'+
      '<div class="tc-job">'+escHtml(t.name||'')+'</div>'+
      '<div class="tc-meta">'+
        '<span class="type-badge type-'+tc.c+'">'+tc.l+'</span>'+
        '<span class="tc-date">'+(t.start_date?t.start_date.substring(5):'')+' '+escHtml((t.job_address||'').substring(0,20))+'</span>'+
        (isA?'<span class="tc-assigned">✓ Tildelt</span>':'')+
      '</div></div>';
  }).join('');
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Board
function shiftW(n){weekOffset+=n;renderBoard();}
function goToday(){weekOffset=0;renderBoard();}

function renderBoard(){
  var days=getWeekDays(weekOffset);
  var wn=getWN(days[0]);
  document.getElementById('wlabel').textContent='Uge '+wn+' — '+fmt(days[0])+'/'+fmt(days[6]);

  // Header
  var hr='<tr><th class="pth">Medarbejder</th>';
  days.forEach(function(d){
    var isT=isToday(d);
    hr+='<th class="dth'+(isT?' today-col':'')+'" data-iso="'+iso(d)+'">'+
      '<div style="display:flex;flex-direction:column;align-items:center;gap:1px">'+
      '<span style="font-size:10px;font-weight:700">'+DAYS[d.getDay()]+' '+d.getDate()+'/'+( d.getMonth()+1)+'</span>'+
      (isT?'<span style="font-size:8px;background:#fff;color:var(--steel);border-radius:3px;padding:0 4px;font-weight:700">I DAG</span>':'')+
      '</div></th>';
  });
  document.getElementById('bth').innerHTML=hr+'</tr>';

  // Body
  var tbody=document.getElementById('btb');
  tbody.innerHTML='';
  var activeUsers=users.filter(function(u){return u.active&&u.role==='employee';});

  activeUsers.forEach(function(u){
    var ac=u.color||'#2563EB';
    var cells='<td class="pcell">'+
      '<div style="display:flex;align-items:center;gap:6px">'+
      '<div class="pav" style="background:'+ac+'22;color:'+ac+'">'+(u.initials||u.name.substring(0,2))+'</div>'+
      '<div><div class="pname">'+escHtml(u.name.split(' ')[0])+'</div><div class="prole">'+escHtml(u.name.split(' ').slice(1).join(' '))+'</div></div>'+
      '</div></td>';

    days.forEach(function(d){
      var dateStr=iso(d);
      var isT=isToday(d);
      // Find assignments for this user on this day
      var dayAssigns=assignments.filter(function(a){
        if(a.user_id!==u.id)return false;
        var sd=(a.start_date||'').split('T')[0];
        var ed=(a.end_date||a.start_date||'').split('T')[0];
        return dateStr>=sd&&dateStr<=ed;
      });

      var pills='';
      dayAssigns.forEach(function(a){
        var tc=TCFG[a.type_guess]||TCFG.other;
        pills+='<div class="apill pill-'+tc.c+'" draggable="true"'+
          ' data-assign-id="'+a.id+'"'+
          ' ondragstart="onAssignDS(event,'+a.id+')"'+
          ' ondragend="onAssignDE()"'+
          ' onclick="openEditAssign('+a.id+')"'+
          '>'+
          '<div class="apill-top">'+
            '<span class="apill-name" title="'+escHtml(a.job_name||a.task_name||'')+'">'+escHtml(a.job_name||a.task_name||'')+'</span>'+
            '<div class="apill-actions">'+
              '<button class="apill-btn" onclick="event.stopPropagation();openEditAssign('+a.id+')" title="Rediger">✏</button>'+
              '<button class="apill-btn" onclick="event.stopPropagation();quickDelete('+a.id+')" title="Fjern">×</button>'+
            '</div>'+
          '</div>'+
          '<div class="apill-extra">'+
            (a.start_time?'<span class="apill-time">⏰ '+escHtml(a.start_time)+'</span>':'')+
            (a.notes?'<span class="apill-note"'+(a.start_time?' style="margin-left:6px"':'')+'>'+escHtml(a.notes)+'</span>':'')+
          '</div>'+
        '</div>';
      });

      var free=dayAssigns.length===0?'<div class="free-slot"><span class="free-b">✓ Ledig</span></div>':'';

      cells+='<td class="dcell'+(isT?' today-col':'')+'" data-date="'+dateStr+'">'+
        '<div class="drop-zone" data-uid="'+u.id+'" data-date="'+dateStr+'"'+
        ' ondragover="onDO(event)"'+
        ' ondragleave="onDL(event)"'+
        ' ondrop="onDrop(event,'+u.id+',\''+dateStr+'\')"'+
        '>'+free+pills+
        '<button style="width:100%;padding:2px;border:1px dashed var(--border);border-radius:4px;background:none;color:var(--ghost);font-size:9px;cursor:pointer;margin-top:2px" onclick="openAssignToUser('+u.id+',\''+dateStr+'\')" title="Tilføj opgave">+ tilføj</button>'+
        '</div></td>';
    });
    tbody.innerHTML+='<tr>'+cells+'</tr>';
  });
}

// DRAG FROM POOL
function onPoolDS(e,taskId){
  dragTask={type:'pool',taskId:taskId};
  e.dataTransfer.effectAllowed='copy';
  setTimeout(function(){
    var el=document.querySelector('[data-task-id="'+taskId+'"]');
    if(el)el.classList.add('dragging');
  },0);
}
function onPoolDE(){
  dragTask=null;
  document.querySelectorAll('.task-card.dragging').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.dg-over').forEach(function(el){el.classList.remove('dg-over');});
}

// DRAG EXISTING ASSIGNMENT
function onAssignDS(e,assignId){
  dragTask={type:'assign',assignId:assignId};
  e.dataTransfer.effectAllowed='move';
  e.stopPropagation();
  setTimeout(function(){
    var el=document.querySelector('[data-assign-id="'+assignId+'"]');
    if(el)el.classList.add('dragging');
  },0);
}
function onAssignDE(){
  dragTask=null;
  document.querySelectorAll('.apill.dragging').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.dg-over').forEach(function(el){el.classList.remove('dg-over');});
}

function onDO(e){e.preventDefault();e.currentTarget.classList.add('dg-over');}
function onDL(e){e.currentTarget.classList.remove('dg-over');}

async function onDrop(e,uid,dateStr){
  e.preventDefault();e.currentTarget.classList.remove('dg-over');
  if(!dragTask)return;

  if(dragTask.type==='pool'){
    // Dragged from task pool → open modal to confirm/add note
    var task=tasks.find(function(t){return t.id===dragTask.taskId;});
    if(!task)return;
    pendingDrop={taskId:dragTask.taskId,userId:uid,dateStr:dateStr};
    dragTask=null;
    openAssignModal(null,task,uid,dateStr);

  } else if(dragTask.type==='assign'){
    // Dragged existing assignment to new cell → move it
    var aid=dragTask.assignId;
    dragTask=null;
    var assign=assignments.find(function(a){return a.id===aid;});
    if(!assign)return;
    var wk=wkey(dateStr);
    var r=await api('/api/assignments/'+aid,{method:'PUT',body:JSON.stringify({
      user_id:uid,week_key:wk,days:assign.days,
      notes:assign.notes,start_time:assign.start_time,
      start_date:dateStr,end_date:dateStr
    })});
    if(r&&r.ok){toast('Opgave flyttet ↔','↔');await loadAll();}
  }
}

// OPEN MODALS
function openAssignFromPool(taskId){
  var task=tasks.find(function(t){return t.id===taskId;});if(!task)return;
  var days=getWeekDays(weekOffset);
  openAssignModal(null,task,null,iso(days[0]));
}
function openAssignToUser(uid,dateStr){
  openAssignModal(null,null,uid,dateStr);
}
function openEditAssign(aid){
  var a=assignments.find(function(x){return x.id===aid;});if(!a)return;
  var task=tasks.find(function(t){return t.id===a.task_id;});
  openAssignModal(aid,task,a.user_id,a.start_date||'');
}

function openAssignModal(aid,task,uid,dateStr){
  editAssignId=aid;
  document.getElementById('mo-title').textContent=aid?'Rediger tildeling':'Tildel opgave';
  // Task info
  if(task){
    document.getElementById('mo-task-info').innerHTML=
      '<strong>'+escHtml(task.job_name||task.name||'')+'</strong><br>'+
      escHtml(task.name||'')+'<br>'+
      '<span style="color:var(--muted)">'+escHtml(task.job_address||'')+(task.start_date?' · '+task.start_date.substring(0,10):'')+
      (task.type_guess?' · <span class="type-badge type-'+(TCFG[task.type_guess]||TCFG.other).c+'">'+(TCFG[task.type_guess]||TCFG.other).l+'</span>':'')+
      '</span>';
    document.getElementById('mo-task-info').dataset.taskId=task.id;
  }
  // User select
  document.getElementById('a-user').innerHTML=users.filter(function(u){return u.active&&u.role==='employee';}).map(function(u){
    return '<option value="'+u.id+'"'+(u.id==uid?' selected':'')+'>'+escHtml(u.name)+'</option>';
  }).join('');
  // Day select — show 14 days
  var days=[];var base=dateStr?new Date(dateStr):new Date();
  for(var i=0;i<14;i++){var d=new Date(base);d.setDate(base.getDate()+i);days.push(d);}
  document.getElementById('a-day').innerHTML=days.map(function(d){
    var s=iso(d);
    return '<option value="'+s+'"'+(s===dateStr?' selected':'')+'>'+DAYS[d.getDay()]+' '+fmt(d)+'</option>';
  }).join('');

  // Pre-fill if editing
  var a=aid?assignments.find(function(x){return x.id===aid;}):null;
  document.getElementById('a-days').value=a?a.days:1;
  document.getElementById('a-time').value=a&&a.start_time?a.start_time:'';
  document.getElementById('a-note').value=a&&a.notes?a.notes:'';
  document.getElementById('a-weekday').value='';
  document.getElementById('a-del-btn').style.display=aid?'inline-flex':'none';
  document.getElementById('mo-assign').classList.add('open');
  setTimeout(function(){document.getElementById('a-note').focus();},80);
}

async function saveAssign(){
  var taskId=(pendingDrop&&pendingDrop.taskId)||
    (document.getElementById('mo-task-info').dataset.taskId)||
    (editAssignId&&assignments.find(function(a){return a.id===editAssignId;})||{}).task_id;
  if(!taskId){toast('Ingen opgave valgt','⚠');return;}
  var uid=parseInt(document.getElementById('a-user').value);
  var dateStr=document.getElementById('a-day').value;
  var days=parseFloat(document.getElementById('a-days').value)||1;
  var startTime=document.getElementById('a-time').value||null;
  var note=document.getElementById('a-note').value.trim()||null;
  var wk=wkey(dateStr);

  if(editAssignId){
    var r=await api('/api/assignments/'+editAssignId,{method:'PUT',body:JSON.stringify({user_id:uid,week_key:wk,days:days,notes:note,start_time:startTime,start_date:dateStr,end_date:dateStr})});
    if(r&&r.ok){toast('Tildeling opdateret','✓');closeMo();await loadAll();}
  } else {
    var r=await api('/api/assignments',{method:'POST',body:JSON.stringify({task_id:taskId,user_id:uid,week_key:wk,days:days,notes:note,start_time:startTime,start_date:dateStr,end_date:dateStr})});
    if(r&&r.ok){toast('Opgave tildelt ✓','✓');closeMo();await loadAll();}
    else if(r&&r.error){toast('Fejl: '+r.error,'❌');}
  }
  pendingDrop=null;
}

async function deleteAssign(){
  if(!editAssignId)return;
  var r=await api('/api/assignments/'+editAssignId,{method:'DELETE'});
  if(r&&r.ok){toast('Tildeling fjernet','🗑');closeMo();await loadAll();}
}

async function quickDelete(aid){
  if(!confirm('Fjern tildeling?'))return;
  var r=await api('/api/assignments/'+aid,{method:'DELETE'});
  if(r&&r.ok){toast('Fjernet','🗑');await loadAll();}
}

// USERS
function renderUsers(){
  document.getElementById('ugrid').innerHTML=users.map(function(u){
    var ac=u.color||'#2563EB';
    return '<div class="ucard">'+
      '<div class="uc-top">'+
        '<div style="width:32px;height:32px;border-radius:50%;background:'+ac+'22;color:'+ac+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">'+escHtml(u.initials||u.name.substring(0,2))+'</div>'+
        '<div style="flex:1;min-width:0"><div class="uc-name">'+escHtml(u.name)+'</div><div class="uc-email">'+escHtml(u.email)+'</div></div>'+
        '<span class="uc-role '+(u.role==='admin'?'ra':'re')+'">'+escHtml(u.role==='admin'?'Admin':'Medarbejder')+'</span>'+
      '</div>'+
      (!u.active?'<div style="font-size:10px;color:#B91C1C;margin-bottom:6px">⛔ Deaktiveret</div>':'')+
      '<div class="uc-login">Login: '+escHtml(u.email)+'</div>'+
      '<div class="uc-acts">'+
        '<button class="ub" onclick="openEditUser('+u.id+')">✏ Rediger</button>'+
        '<button class="ub" onclick="copyLogin(\''+escHtml(u.email)+'\')">📋 Kopier login</button>'+
      '</div></div>';
  }).join('');
}

function copyLogin(email){
  navigator.clipboard.writeText('URL: '+window.location.origin+'\nEmail: '+email);
  toast('Login-info kopieret','📋');
}

function openAddUser(){
  editUserId=null;
  document.getElementById('mo-user-title').textContent='Tilføj ny bruger';
  ['u-name','u-email','u-pw','u-ini','u-jtname'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('u-role').value='employee';
  document.getElementById('u-color').value='#2563EB';
  document.getElementById('u-del-btn').style.display='none';
  document.getElementById('mo-user').classList.add('open');
  setTimeout(function(){document.getElementById('u-name').focus();},80);
}
function openEditUser(id){
  var u=users.find(function(x){return x.id===id;});if(!u)return;
  editUserId=id;
  document.getElementById('mo-user-title').textContent='Rediger bruger';
  document.getElementById('u-name').value=u.name;
  document.getElementById('u-email').value=u.email;
  document.getElementById('u-pw').value='';
  document.getElementById('u-ini').value=u.initials||'';
  document.getElementById('u-role').value=u.role;
  document.getElementById('u-color').value=u.color||'#2563EB';
  document.getElementById('u-jtname').value=u.jobtread_name||'';
  document.getElementById('u-del-btn').style.display='inline-flex';
  document.getElementById('mo-user').classList.add('open');
}
async function saveUser(){
  var name=document.getElementById('u-name').value.trim();
  var email=document.getElementById('u-email').value.trim();
  var pw=document.getElementById('u-pw').value;
  if(!name||!email){toast('Navn og email påkrævet','⚠');return;}
  var body={name:name,email:email,role:document.getElementById('u-role').value,color:document.getElementById('u-color').value,initials:document.getElementById('u-ini').value.trim(),jobtread_name:document.getElementById('u-jtname').value.trim()};
  if(pw)body.password=pw;
  var r;
  if(editUserId){r=await api('/api/users/'+editUserId,{method:'PUT',body:JSON.stringify(body)});}
  else{if(!pw){toast('Adgangskode påkrævet','⚠');return;}r=await api('/api/users',{method:'POST',body:JSON.stringify(body)});}
  if(r&&(r.ok||r.id)){toast('Bruger gemt','✓');document.getElementById('mo-user').classList.remove('open');await loadAll();}
  else{toast(r&&r.error||'Fejl','❌');}
}
async function deactivateUser(){
  if(!editUserId||!confirm('Deaktiver bruger?'))return;
  await api('/api/users/'+editUserId,{method:'PUT',body:JSON.stringify({active:0})});
  toast('Bruger deaktiveret','🗑');document.getElementById('mo-user').classList.remove('open');await loadAll();
}

// Time logs
async function loadTimeLogs(){
  var logs=await api('/api/time/all');if(!logs)return;
  document.getElementById('tlog-body').innerHTML=logs.map(function(l){
    var mins=l.duration_minutes||0,h=Math.floor(mins/60),m=mins%60;
    return '<tr><td style="font-weight:700">'+escHtml(l.user_name)+'</td>'+
      '<td>'+escHtml(l.task_name||'')+'</td>'+
      '<td>'+escHtml(l.job_name||'')+'</td>'+
      '<td style="font-size:10px">'+(l.started_at||'').replace('T',' ').substring(0,16)+'</td>'+
      '<td style="font-size:10px">'+(l.stopped_at?(l.stopped_at||'').replace('T',' ').substring(0,16):'<span style="color:#16A34A;font-weight:700">Aktiv ⏱</span>')+'</td>'+
      '<td style="font-weight:700">'+(l.stopped_at?h+'t '+m+'m':'—')+'</td></tr>';
  }).join('');
}

// Page nav
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.getElementById('page-'+b.dataset.page).classList.add('active');
    b.classList.add('active');
    if(b.dataset.page==='timelogs')loadTimeLogs();
    if(b.dataset.page==='plan')renderBoard();
  });
});

document.getElementById('mo-assign').addEventListener('click',function(e){if(e.target===document.getElementById('mo-assign'))closeMo();});
document.getElementById('mo-user').addEventListener('click',function(e){if(e.target===document.getElementById('mo-user'))document.getElementById('mo-user').classList.remove('open');});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeMo();document.getElementById('mo-user').classList.remove('open');}
  if(e.key==='Enter'&&document.getElementById('mo-assign').classList.contains('open'))saveAssign();
});

loadAll();
